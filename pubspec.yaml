name: hsk
description: A local-first Mandarin learning app based on the New HSK curriculum, with Pinyin, Hanzi, tone, randomized flashcards, quizzes, and offline progress tracking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  path: ^1.9.1
  stroke_order_animator: ^3.3.1
  sqlite3: ^3.3.2

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/databases/
    - assets/audio/pinyin
