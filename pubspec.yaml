name: hsk
description: A local-first Mandarin learning app based on the New HSK curriculum, with Pinyin, Hanzi, tone, randomized flashcards, quizzes, and offline progress tracking.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true